schema_version: '1.0'
defaults:
  project_file_candidates:
  - axiom.project.yaml
  - .axiom/project.yaml
  fallback_domain: generic-embedded
  fallback_profile: generic-embedded
runtime:
  ask_threshold: 0.5
  prompt_overrides_weak_repo_signal: true
  clarification_question: 'I detected conflicting project signals (repo={repo_domain},
    prompt={prompt_domain}). Which domain should I use for this run? Reply: {candidates}.'
  token_budget:
    primary_cap: 8
    group_cap: 12
    max_context_files: 8
  production_output_contract:
  - verdict
  - domain_used
  - skills_loaded
  - skills_deferred
  - standards_applied
  - evidence_refs
  - approval_gate
  - followups
