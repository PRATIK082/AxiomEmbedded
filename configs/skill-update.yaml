program: embedded-skills-deep-update
version: 1.0.0
models:
  architect: muse-spark-1.3
  coder: fledge-alpha
  tools: ling-3.0-flash
triggers:
  - manual
  - schedule: "0 0 * * 0"
permissions:
  read: repository
  write: repository
  read_prs: true
coverage:
  asil_a_dal_d:
    statement: 100
    branch: 100
  asil_b_dal_c:
    statement: 100
    branch: 100
    mcdc: recommended
  asil_cd_dal_ab:
    statement: 100
    branch: 100
    mcdc: required
build:
  cmake_min: 3.20
  flags: -Wall -Wextra -Werror
  compilers: [gcc, clang]
  archs: [arm, riscv, mips]
quality:
  max_lines_per_file: 500
  max_complexity: 15
  standards_ref_required: true
