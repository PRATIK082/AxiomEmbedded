name: Bug report
description: Report a reproducible defect in AxiomEmbedded.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AxiomEmbedded. Please remove credentials, customer source, proprietary specifications, and other confidential data from logs and examples before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What is broken and what impact does it have?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - CLI or packaging
        - Agent runtime or AI client integration
        - Skills, rules, or standards mappings
        - Workflow or V-cycle engine
        - Artifact graph, context, or traceability
        - Domain or platform profiles
        - Tool execution or permissions
        - Tests, validation, or evidence
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include exact sanitized commands and the smallest reproducible example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and output
      description: Paste sanitized logs or a short traceback. Remove tokens, private paths, and confidential data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, install method, AI client/tool versions, and relevant profile.
    validations:
      required: true
