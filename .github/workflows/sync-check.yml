# SPDX-License-Identifier: Apache-2.0
# Phase 1c: generated client files must match skills/ and agents/.
name: sync-check

on:
  push:
  pull_request:

jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml pytest
      - run: python scripts/sync_clients.py --check
      - run: python -m pytest tests/test_sync_clients.py tests/test_axiom_mcp.py tests/test_dist_entry.py tests/test_install.py -q
