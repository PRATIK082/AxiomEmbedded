# SPDX-License-Identifier: Apache-2.0
# Nightly drift watch: catches generated-file / catalog drift that slips
# past PR gates (e.g. direct pushes, external edits). Failing run = open
# an issue / re-run `axiom skills apply` on main.
name: nightly-drift

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml pytest
      - run: python scripts/skill_pipeline.py --check
      - run: python -m pytest -q
