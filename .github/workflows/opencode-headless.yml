# SPDX-License-Identifier: Apache-2.0
# Phase 2c: keyless headless integration against the real opencode binary.
name: opencode-headless

on:
  push:
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml pytest
      - run: curl -fsSL https://opencode.ai/install | bash
      - run: echo "$HOME/.opencode/bin" >> $GITHUB_PATH
      - run: opencode --version
      - run: python -m axiom_cli doctor --skip-tests
      - run: python -m pytest tests/test_headless.py tests/test_launcher.py -q
      # .opencode/ and .claude/ are gitignored client mirrors, not tracked
      # sources. A fresh CI checkout has none, so the plugin must be
      # generated before it can be syntax-checked (same pattern as
      # sync-check.yml: generate first, then verify).
      - run: python scripts/sync_clients.py
      # axiom-policy.ts is written in the JavaScript subset of TypeScript on
      # purpose: `node --check` is only a JavaScript parser on some Node
      # releases (it does not apply TypeScript type stripping), so a file
      # with type annotations fails the check depending on the Node patch
      # release. The gate is therefore deterministic on every Node version.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check .opencode/plugins/axiom-policy.ts
