name: skill-validation
on: [push, pull_request]
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pyyaml pytest
      - run: python scripts/scaffold_axiom_skills.py --check
      - run: python scripts/link_related_skills.py --check
      - run: python scripts/enrich_catalog_facets.py --check
      - run: python scripts/validate_skills.py
      - run: python -m pytest -q tests/test_skill_framework.py tests/test_skills_packaging.py tests/test_skill_tools.py
