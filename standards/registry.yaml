# SPDX-License-Identifier: Apache-2.0
# Standards registry for AxiomEmbedded DESA.
#
# Single source of truth for standard records with lifecycle state.
# Each standard has: id, title, edition, publication_date, status, authority,
# source_url, last_verified, normative_text_included, applicability.
#
# Status values: published, draft, pre-release, proposed, withdrawn, superseded.
# A draft/pre-release/proposed standard must NOT silently replace a published
# edition in a project baseline.

schema_version: '1.0'
