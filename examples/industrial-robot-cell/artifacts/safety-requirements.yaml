  - "Q1: Confirm 50 ms interlock budget with PLC vendor data (owner: controls-team)."
approval_status: approved
requirements:
  - id: REQ-001
    text: The safety controller shall remove arm motive power within 50 ms of either gate-interlock channel opening.
    covers_hazards: [HAZ-001]
    verification: test
    status: approved
  - id: REQ-002
    text: Gate release shall be denied until monitored standstill of all axes is confirmed.
    covers_hazards: [HAZ-001]
    verification: test
    status: approved
  - id: REQ-003
    text: Actuation of any e-stop device shall trigger a Category 0 stop independent of cell software.
    covers_hazards: [HAZ-002]
    verification: test
    status: approved
  - id: REQ-004
    text: Cell restart from HMI reset shall require gate-closed state plus a deliberate two-step operator action.
    covers_hazards: [HAZ-003]
    verification: inspection
    status: approved
  - id: REQ-005
    text: The telemetry gateway shall permit outbound-only traffic to one allow-listed plant destination.
    covers_hazards: [HAZ-004]
    verification: analysis
    status: approved
