hazards:
  - id: HAZ-001
    description: Unexpected arm motion while operator is inside the cell (gate bypassed or interlock fault) in automatic mode.
    severity: critical
    controls: [CTL-001, CTL-002]
    rationale: Dual-channel interlock plus monitored standstill before gate release.
  - id: HAZ-002
    description: Failure of emergency-stop loop to halt motion on demand.
    severity: critical
    controls: [CTL-003]
    rationale: Hardwired Category 0 stop independent of software.
  - id: HAZ-003
    description: Mode-confusion restart from HMI reset while technician is in cell.
    severity: high
    controls: [CTL-004]
    rationale: Reset requires gate-closed plus deliberate two-step HMI action.
  - id: HAZ-004
    description: Telemetry gateway used as entry to cell controller network.
    severity: medium
    controls: [CTL-005]
    rationale: Gateway is outbound-only with allow-listed destination.
