    platforms: [mcu, mpu, autosar-classic, autosar-adaptive]
  robotics:
    description: ROS 2 distro policy, interface-first nodes, real-time paths, simulation-first testing. Use when building robot behaviors on embedded compute.
    domains: [robotics, industrial]
    platforms: [mpu, soc, linux]
  edge-ai:
    description: Model quantization, runtime/delegate selection, memory/latency/power budgets. Use when deploying ML inference on constrained targets.
    domains: [generic-embedded, automotive, industrial, iot, robotics]
    platforms: [mcu, mpu, soc, mpsoc]
  ai-validation:
    description: ODD discipline, dataset independence, statistical acceptance, drift monitoring. Use when assuring ML components or arguing AI safety.
    domains: [generic-embedded, automotive, industrial, iot, robotics]
    platforms: [mcu, mpu, soc, mpsoc]
  mcu:
    description: MCU firmware engineering - core selection, startup, MPU/TrustZone, HAL, RTOS choice. Use for bare-metal or RTOS firmware on Cortex-M/RISC-V.
    domains: [generic-embedded, automotive, industrial, iot, robotics]
    platforms: [mcu, bare-metal, rtos]
  mpu:
    description: MPU-based design - selection from measured load, ECC/DDR, power sequencing, debug-by-design. Use when moving to application processors.
    domains: [generic-embedded, automotive, industrial, iot, robotics]
    platforms: [mpu, linux]
  soc:
    description: Heterogeneous SoC allocation across A/R cores, NPUs, safety islands, power/thermal. Use when architecting multi-core SoC products.
    domains: [generic-embedded, automotive, industrial, robotics]
    platforms: [soc, mpsoc]
  mpsoc:
    description: MPSoC NoC QoS, coherency domains, PL-as-hardware timing closure, cross-die safety. Use for FPGA-SoC or multi-die platforms.
    domains: [generic-embedded, automotive, aerospace, defense, industrial]
    platforms: [mpsoc, soc]
  rtos:
    description: RTOS selection, scheduling/IPC rules, MPU partitioning, WCET verification. Use for FreeRTOS/Zephyr/ThreadX designs or timing analysis.
