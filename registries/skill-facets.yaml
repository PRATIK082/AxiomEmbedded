    platforms: [mcu, mpu, rtos]
  bare-metal:
    description: Reset-to-main init, fault handlers, ISR discipline, super-loop and time-triggered patterns. Use for no-OS firmware or boot code.
    domains: [all]
    platforms: [mcu, bare-metal]
  build-system:
    description: Warnings-as-errors builds, pinning, toolchain separation, SLSA provenance. Use when setting up CMake builds or reproducible toolchains.
    domains: [all]
    platforms: [all]
  requirements-traceability:
    description: CI orphan checks, suspect triage, and matrix hygiene. Use when automating trace maintenance in pipelines.
    domains: [all]
    platforms: [all]
  test-automation:
    description: Host+target CI stages, farm discipline, flaky quarantine, feedback budgets. Use when building embedded CI pipelines or HIL farms.
    domains: [all]
    platforms: [all]
  hardware-bringup:
    description: Power-to-bootloader staging, golden captures, deviation logs. Use when powering new boards or debugging no-boot failures.
    domains: [all]
    platforms: [mcu, mpu, soc, mpsoc]
  project-audit:
    description: Criteria-first audits, sampling, independence, re-audit closure. Use when auditing projects, suppliers, or compliance readiness.
    domains: [all]
    platforms: [all]
