# Tool candidate registry — the pluggable-tool surface of AxiomEmbedded.
#
# This is the RESEARCH registry: every open-source tool that can plausibly be
# plugged into AxiomEmbedded, with its licence, install channel, the Axiom
# extension point it serves, and the concrete benefit it brings.
#
# It is deliberately separate from registries/tool-index.json, which lists only
# tools that are IMPLEMENTED today (tools/<id>/manifest.yaml + pip deps).
# Flow:  candidate (here) -> accepted -> tools/<id>/manifest.yaml -> tool-index.json
#
# Rules honoured by this file:
#   - "Keep standards metadata and applicability separate from proprietary
#      normative text."  => no candidate may require vendored standard prose.
#      MISRA/CIS/XCCDF rule text is user-supplied at runtime, never committed.
#   - Copyleft (GPL/AGPL) candidates use linkage: subprocess. They are never
#      imported into Axiom code that ships.
#   - "Generated files must identify their generator and remain reproducible."
#      => generated_from below names the survey; the file itself is hand-maintained.
#
# Validate: python scripts/validate_tool_candidates.py
# Survey:   docs/research/2026-10-21-global-embedded-agent-tool-catalog.md
version: 1.0.0
