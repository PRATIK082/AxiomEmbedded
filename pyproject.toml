[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-embedded"
version = "0.2.0"
description = "Open AI-native engineering platform for embedded and cyber-physical systems"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
# Optional capability groups. Runtime core stays stdlib + PyYAML so
# `pip install axiom-embedded` never breaks; every other dep is an extra.
mcp = ["mcp>=1.0"]             # official MCP Python SDK (P1 registry track)
serve = ["fastapi>=0.110", "uvicorn>=0.29"]  # REST/A2A HTTP transport
eval = ["pyyaml>=6.0", "pytest>=8,<10"]       # evaluation task runner

[project.scripts]
axiom = "axiom_cli.main:main"

[tool.setuptools.packages.find]
# Explicit allowlist: the repo root holds many non-package content trees
# (agents/, skills/, domains/, ...). Auto-discovery would either fail the
# build or sweep content dirs into the wheel.
include = ["axiom_cli*", "axiom_mcp*", "packages*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"
