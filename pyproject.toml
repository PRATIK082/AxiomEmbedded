[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-embedded"
version = "0.1.0"
description = "Open AI-native engineering platform for embedded and cyber-physical systems"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
axiom = "axiom_cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"
