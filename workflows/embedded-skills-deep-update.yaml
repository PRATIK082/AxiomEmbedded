id: embedded-skills-deep-update
version: 2.0.0
description: DESA-gated deep research and comprehensive update of embedded skills, one review-gated branch per skill
engine: AxiomEmbedded
triggers:
  - manual
  - schedule: "0 0 * * 0"
permissions:
  - read: repository
  - write: repository
  - read: pull_requests
states:
  - id: request
  - id: audit
  - id: research
  - id: plan
  - id: implement
  - id: verify
  - id: evidence
  - id: review
  - id: pr
transitions:
  - from: request
    to: audit
  - from: audit
    to: research
  - from: research
    to: plan
  - from: plan
    to: implement
  - from: implement
    to: verify
  - from: verify
    to: implement
    condition: retry_count < 3
  - from: verify
    to: plan
    condition: retry_count >= 3
  - from: verify
    to: evidence
    condition: gates_pass
  - from: evidence
    to: review
  - from: review
    to: pr
    condition: human_approval_if_sensitive
gates:
  - evidence-required
  - human-approval-for-sensitive-actions
  - no-breaking-change-without-migration
  - standards-cited
  - desa-facets-valid
  - catalog-index-consistent
  - one-branch-per-skill
policies:
  lifecycle: v-model
  mode: plan-then-execute
  per_skill_branch: "feat/skill-<name>"
  max_verify_retries: 3
  # DESA best practices (see docs/skill-development/review-gates.md G1-G5)
  reuse_before_create: true
  facets_required:
    - activity
    - capability_kind
    - primary_domain
    - risk_class
    - lifecycle_phases
    - standard_ids
  review_gates: docs/skill-development/review-gates.md
  routing_source_of_truth: configs/domain-routing.yaml
  generated_files_owner: skill_pipeline.py
  verification:
    - python scripts/skill_pipeline.py --check
    - python -m pytest tests/test_desa_phases.py -q
    - python -m pytest tests/test_packaging.py -q
